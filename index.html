  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <div class="loader" id="loader" aria-hidden="true"><img src="assets/davidblogo.png" alt="" width="640" height="491" /><span class="loader-bar"><i></i></span></div>
  <header class="nav">
    <a class="brand" href="index.html" aria-label="David Boateng's Simulations home"><img src="assets/davidblogo.png" alt="" width="640" height="491" /><span class="brand-tag">Simulations</span></a>

    <section class="library" aria-label="Simulation library">

      <div class="grid" id="grid" aria-live="polite"></div>

    <aside class="intro">
      <h1 class="intro-title"><img src="assets/davidblogo.png" alt="DAVID B." width="640" height="491" /><span>Simulations</span></h1>
